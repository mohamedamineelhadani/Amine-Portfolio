<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c14;--ink:#f4f1ee;--muted:#a09aac;--glass:rgba(255,255,255,.06);--hover:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--a:#ff6a1a;--a2:#ff4d6d;--bad:#ff6b6b;--r:20px}
@media(prefers-color-scheme:light){:root{--bg:#f8f3ee;--ink:#1b1620;--muted:#625a6b;--glass:rgba(255,255,255,.72);--hover:rgba(255,255,255,.95);--line:rgba(60,30,10,.14);--a:#d9480f;--a2:#c2255c;--bad:#c92a2a}}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{min-height:100svh;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;z-index:-1;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.25}
body::before{background:var(--a);top:-25%;right:-15%}body::after{background:#6b7bff;bottom:-30%;left:-20%;opacity:.2}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;line-height:1.15}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:10px}
svg{width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:500;font-size:14px;transition:.2s}
.btn:hover{background:var(--hover);border-color:var(--a)}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:#fff;box-shadow:0 10px 28px -10px var(--a)}
.btn.bad:hover,.btn.arm{border-color:var(--bad);color:var(--bad)}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 10px 26px -8px var(--a)}
/* login */
#login{min-height:100svh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:410px;padding:34px;border:1px solid var(--line);border-radius:26px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card .logo{margin-bottom:20px}.card h1{font-size:30px;margin-bottom:6px}.card>p{color:var(--muted);margin-bottom:8px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:500}
input[type=email],input[type=password],input[type=search]{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;transition:.2s}
input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent)}
.card .btn{width:100%;justify-content:center;margin-top:24px;padding:14px}
.err{color:var(--bad);min-height:1.4em;margin-top:12px;font-size:14px}
/* shell */
.shell{max-width:1260px;margin:0 auto;padding:20px;height:100svh;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:14px}
.top .brand{display:flex;align-items:center;gap:12px;margin-right:auto}.brand h1{font-size:22px}.brand small{color:var(--muted);display:block;font-size:13px}
.search{position:relative;width:min(300px,40vw)}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:42px;border-radius:999px;padding-top:10px;padding-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(16px)}
.stat b{display:block;font:700 30px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:13px}
.stat.hot b{background:linear-gradient(120deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.inbox{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr;gap:16px}
.pane{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px;border-radius:12px;color:var(--muted);font-weight:500;font-size:14px;transition:.2s}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
#list{overflow-y:auto;flex:1;padding:8px}
.row{width:100%;display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;text-align:left;position:relative;transition:background .2s}
.row:hover{background:var(--hover)}.row.active{background:color-mix(in srgb,var(--a) 15%,transparent)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:600 15px 'Space Grotesk',sans-serif;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.meta{min-width:0;flex:1}.l1{display:flex;justify-content:space-between;gap:8px}
.l1 strong{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l1 time{color:var(--muted);font-size:12px;flex:none}
.meta p{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread strong{font-weight:700}.row.unread p{color:var(--ink)}
.row.unread::after{content:"";position:absolute;right:12px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent)}
.row.unread .l1 time{display:none}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:50px 20px;gap:10px;flex:1}
.empty svg{width:44px;height:44px;opacity:.5}
/* detail */
.detail{padding:28px;overflow-y:auto;flex:1}
.dh{display:flex;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.dh .av{width:58px;height:58px;border-radius:18px;font-size:20px}
.dh h2{font-size:26px}.dh a{color:var(--a);text-decoration:none;font-size:14.5px}.dh a:hover{text-decoration:underline}
.when{color:var(--muted);font-size:13px;margin-top:2px}
.body{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--glass);white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.7}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.back{display:none;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;transition:.3s;pointer-events:none;z-index:50}
.toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:860px){
  .shell{height:auto;min-height:100svh}.inbox{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}
  #list{max-height:none}.top{flex-wrap:wrap}.search{width:100%;order:3}
  .pane.read{position:fixed;inset:0;z-index:20;border-radius:0;background:var(--bg);display:none}.inbox.open .pane.read{display:flex}
  .back{display:inline-flex}.detail{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="login" hidden>
  <form class="card" id="loginForm">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
    <h1>Welcome back</h1><p>Sign in to read your portfolio messages.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn p" type="submit">Sign in</button>
  </form>
</main>

<div class="shell" id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><div><h1>Inbox</h1><small>Portfolio messages</small></div></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search messages" aria-label="Search messages"></div>
    <button class="btn" id="out" type="button">Sign out</button>
  </header>
  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="sTotal">0</b><span>Total messages</span></div>
    <div class="stat hot"><b id="sUnread">0</b><span>Unread</span></div>
    <div class="stat"><b id="sWeek">0</b><span>Last 7 days</span></div>
    <div class="stat"><b id="sToday">0</b><span>Today</span></div>
  </section>
  <div class="inbox" id="inbox">
    <section class="pane" aria-label="Messages">
      <div class="tabs" role="tablist"><button role="tab" data-t="all" aria-selected="true">All</button><button role="tab" data-t="unread" aria-selected="false">Unread</button></div>
      <div id="list"></div>
    </section>
    <section class="pane read" aria-live="polite"><div class="detail" id="detail"></div></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
const api=async(url,opt={})=>{
  const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}
  return j;
};
let items=[],sel=null,tab='all',st={};
const hue=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const avatar=n=>{const a=el('div','av',initials(n));a.style.background=`linear-gradient(135deg,hsl(${hue(n)} 70% 52%),hsl(${(hue(n)+40)%360} 70% 42%))`;return a};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function show(ok){$('#login').hidden=ok;$('#app').hidden=!ok;if(ok)load()}

$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
  try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pw').value})});$('#pw').value='';show(true)}
  catch(x){$('#err').textContent=x.message}};
$('#out').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});show(false)};
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));load()});

async function load(){
  try{const r=await api('/api/admin/messages?q='+encodeURIComponent($('#q').value)+(tab==='unread'?'&status=unread':''));items=r.items;st=r;draw()}
  catch(x){x.status===401?show(false):toast(x.message)}
}
function draw(){
  $('#sTotal').textContent=st.total;$('#sUnread').textContent=st.unread;$('#sWeek').textContent=st.week;$('#sToday').textContent=st.today;
  const box=$('#list');box.replaceChildren();
  if(!items.length){const e=el('div','empty');e.innerHTML=ICON;e.append(el('p',null,tab==='unread'?'You are all caught up.':'No messages yet.'));box.append(e)}
  items.forEach(m=>{
    const b=el('button','row'+(m.read?'':' unread')+(m._id===sel?' active':''));b.type='button';
    const meta=el('div','meta'),l1=el('div','l1');
    l1.append(el('strong',null,m.name),el('time',null,ago(m.createdAt)));meta.append(l1,el('p',null,m.message.replace(/\s+/g,' ')));
    b.append(avatar(m.name),meta);b.onclick=()=>pick(m._id);box.append(b)});
  detail();
}
async function pick(id){
  sel=id;$('#inbox').classList.add('open');const m=items.find(x=>x._id===id);
  if(m&&!m.read){m.read=true;st.unread=Math.max(0,st.unread-1);api('/api/admin/messages/'+id,{method:'PATCH',body:JSON.stringify({read:true})}).catch(()=>{})}
  draw();
}
function detail(){
  const d=$('#detail');d.replaceChildren();const m=items.find(x=>x._id===sel);
  if(!m){const e=el('div','empty');e.innerHTML=ICON;e.append(el('p',null,'Select a message to read it.'));d.append(e);return}
  const back=el('button','btn back','Back to inbox');back.onclick=()=>{$('#inbox').classList.remove('open')};
  const h=el('div','dh'),who=el('div');const a=el('a',null,m.email);a.href='mailto:'+m.email;
  who.append(el('h2',null,m.name),a,el('div','when',new Date(m.createdAt).toLocaleString(undefined,{dateStyle:'full',timeStyle:'short'})));
  h.append(avatar(m.name),who);
  const acts=el('div','acts');
  const reply=el('a','btn p','Reply by email');reply.href='mailto:'+m.email+'?subject='+encodeURIComponent('Re: your message');reply.style.textDecoration='none';
  const copy=el('button','btn','Copy email');copy.onclick=()=>navigator.clipboard.writeText(m.email).then(()=>toast('Email copied'));
  const unread=el('button','btn','Mark unread');unread.onclick=async()=>{await api('/api/admin/messages/'+m._id,{method:'PATCH',body:JSON.stringify({read:false})});sel=null;$('#inbox').classList.remove('open');toast('Marked as unread');load()};
  const del=el('button','btn bad','Delete');
  del.onclick=async()=>{
    if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='Click again to confirm';setTimeout(()=>{del.classList.remove('arm');del.textContent='Delete'},3000);return}
    await api('/api/admin/messages/'+m._id,{method:'DELETE'});sel=null;$('#inbox').classList.remove('open');toast('Message deleted');load()};
  acts.append(reply,copy,unread,del);
  d.append(back,h,el('div','body',m.message),acts);
}
api('/api/admin/me').then(()=>show(true)).catch(()=>show(false));
</script>
</body>
</html>
