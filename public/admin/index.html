<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="login" hidden>
  <form class="card" id="loginForm">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
    <h1>Welcome back</h1><p>Sign in to read your portfolio messages.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn p" type="submit">Sign in</button>
  </form>
</main>

<div class="shell" id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><div><h1>Inbox</h1><small>Portfolio messages</small></div></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search messages" aria-label="Search messages"></div>
    <button class="btn" id="out" type="button">Sign out</button>
  </header>
  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="sTotal">0</b><span>Total messages</span></div>
    <div class="stat hot"><b id="sUnread">0</b><span>Unread</span></div>
    <div class="stat"><b id="sWeek">0</b><span>Last 7 days</span></div>
    <div class="stat"><b id="sToday">0</b><span>Today</span></div>
  </section>
  <div class="inbox" id="inbox">
    <section class="pane" aria-label="Messages">
      <div class="tabs" role="tablist"><button role="tab" data-t="all" aria-selected="true">All</button><button role="tab" data-t="unread" aria-selected="false">Unread</button></div>
      <div id="list"></div>
    </section>
    <section class="pane read" aria-live="polite"><div class="detail" id="detail"></div></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="js/script.js"></script>
</body>
</html>
